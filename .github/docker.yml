# From https://github.com/Pwnzer0tt1/digger/blob/86d9ba0efbf8be4105550172bcdd0dcf7b3129c8/.github/workflows/docker-publish.yml

name: Publish docker images

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'suricata/**'
      - 'shared/**'
      - 'grafana/**'
      - '.github/workflows/docker.yml'
  release:
    types:
      - published
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: 'suricata/Dockerfile.suricata'
            image_name: tulip-suricata
            context: ./suricata
          - dockerfile: 'frontend/Dockerfile-frontend'
            image_name: tulip-frontend
            context: ./frontend
          - dockerfile: 'services/api/Dockerfile-api'
            image_name: tulip-api
            context: ./services/api
          - dockerfile: 'services/flagids/Dockerfile'
            image_name: tulip-flagids
            context: ./services/flagids
          - dockerfile: 'services/go-importer/Dockerfile-assembler'
            image_name: tulip-assembler
            context: ./services/go-importer
          - dockerfile: 'services/go-importer/Dockerfile-enricher'
            image_name: tulip-enricher
            context: ./services/go-importer
          - dockerfile: 'services/timescale/Dockerfile'
            image_name: tulip-timescale
            context: ./services/timescale

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert to lowercase
        id: lowercase
        run: |
          echo "repository=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Convert repository name to lowercase
        id: lowercase
        run: echo "image_name=${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.repository }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.lowercase.outputs.repository }}/${{ matrix.image_name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.lowercase.outputs.repository }}/${{ matrix.image_name }}:buildcache,mode=max
