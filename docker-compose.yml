version: "3.5"
services:
  timescale:
    build: services/timescale
    image: ghcr.io/srdnlen/tulip-timescale
    restart: unless-stopped
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./services/schema/system.sql:/docker-entrypoint-initdb.d/100_system.sql:ro
      - ./services/schema/functions.sql:/docker-entrypoint-initdb.d/101_functions.sql:ro
      - ./services/schema/schema.sql:/docker-entrypoint-initdb.d/102_schema.sql:ro
    networks:
      - internal
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: tulip
      POSTGRES_DB: tulip
    # This does not need to be adjusted, unless you actually want to limit it
    # Postgres uses shared memory for caching, and docker assigns just 64 MB by default
    shm_size: "128g"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tulip"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ghcr.io/srdnlen/tulip-frontend
    build:
      context: frontend
      dockerfile: Dockerfile-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    expose:
      - 3000
    depends_on:
      timescale:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - internal
    environment:
      API_SERVER_ENDPOINT: http://api:5000/
      VIRTUAL_HOST: tulip.h4xx.eu

  grafana:
    image: grafana/grafana:12.4
    restart: unless-stopped
    ports:
      - "3001:3000"
    expose:
      - 3000
    depends_on:
      timescale:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards/home.json:/var/lib/grafana/dashboards/home.json:ro
    environment:
      GF_SERVER_HTTP_PORT: 3000
      GF_LOG_LEVEL: warn
      GF_ANALYTICS_CHECK_FOR_PLUGINS_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/home.json
      GF_INSTALL_PLUGINS: grafana-clock-panel

  api:
    image: ghcr.io/srdnlen/tulip-api
    build:
      context: services/api
      dockerfile: Dockerfile-api
    restart: unless-stopped
    depends_on:
      timescale:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ${TRAFFIC_DIR_HOST}:${TRAFFIC_DIR_DOCKER}:ro
    environment:
      TIMESCALE: ${TIMESCALE}
      TULIP_TRAFFIC_DIR: ${TRAFFIC_DIR_DOCKER}
      FLAG_REGEX: ${FLAG_REGEX}
      TICK_START: ${TICK_START}
      TICK_LENGTH: ${TICK_LENGTH}
      VM_IP: ${VM_IP}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  flagids:
    image: ghcr.io/srdnlen/tulip-flagids
    restart: unless-stopped
    build:
      context: services/
      dockerfile: flagids/Dockerfile
    image: tulip-flagids:latest
    depends_on:
      timescale:
        condition: service_healthy
    networks:
      - internal
    environment:
      TIMESCALE: ${TIMESCALE}
      TICK_START: ${TICK_START}
      TICK_LENGTH: ${TICK_LENGTH}
      FLAGID_SCRAPE: ${FLAGID_SCRAPE}
      TEAM_ID: ${TEAM_ID}
      FLAGID_ENDPOINT: ${FLAGID_ENDPOINT}
      VISUALIZER_URL: ${VISUALIZER_URL}
      DUMP_PCAPS: ${DUMP_PCAPS}

  assembler:
    image: ghcr.io/srdnlen/tulip-assembler
    build:
      context: services/go-importer
      dockerfile: Dockerfile-assembler
    restart: unless-stopped
    depends_on:
      timescale:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ${TRAFFIC_DIR_HOST}:${TRAFFIC_DIR_DOCKER}:ro,z
    # Command line flags most likely to fix a tulip issue:
    # - -http-session-tracking: enable HTTP session tracking
    # - -dir: directory to read traffic from
    # - -skipchecksum: skip checksum validation
    # - -flush-after: i.e. 2m Not needed in pcap rotation mode
    # - -disable-converters: disable converters
    # - -discard-extra-data: dont split large flow items, just discard them
    command: "./assembler -http-session-tracking -skipchecksum -disable-converters -dir ${TRAFFIC_DIR_DOCKER}"
    environment:
      TIMESCALE: ${TIMESCALE}
      FLAG_REGEX: ${FLAG_REGEX}
      TICK_START: ${TICK_START}
      TICK_LENGTH: ${TICK_LENGTH}
      FLAGID_SCAN: ${FLAGID_SCAN}
      FLAG_LIFETIME: ${FLAG_LIFETIME}
      FLAG_VALIDATOR_TYPE: ${FLAG_VALIDATOR_TYPE}
      FLAG_VALIDATOR_TEAM: ${FLAG_VALIDATOR_TEAM}
      PCAP_OVER_IP: ${PCAP_OVER_IP}
      DUMP_PCAPS: ${DUMP_PCAPS}
      DUMP_PCAPS_INTERVAL: ${DUMP_PCAPS_INTERVAL}
      DUMP_PCAPS_FILENAME: ${DUMP_PCAPS_FILENAME}
      BPF: ${BPF}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  enricher:
    image: ghcr.io/srdnlen/tulip-enricher
    build:
      context: services/go-importer
      dockerfile: Dockerfile-enricher
    restart: unless-stopped
    depends_on:
      timescale:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ${TRAFFIC_DIR_HOST}:${TRAFFIC_DIR_DOCKER}:ro,z
      - ${SURICATA_DIR_HOST}/socket:/suricata
      - ${SURICATA_DIR_HOST}/log:/log
    command: "./enricher -eve /suricata/eve.sock"
    environment:
      ENRICHER_MODE: ${ENRICHER_MODE}
      TIMESCALE: ${TIMESCALE}
      ENRICHER_WORKERS: ${ENRICHER_WORKERS}
      ENRICHER_BUFFER_SIZE: ${ENRICHER_BUFFER_SIZE}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ "$ENRICHER_MODE" = "file" ]; then exit 0; else test -S /suricata/eve.sock || exit 1; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  suricata:
    image: ghcr.io/srdnlen/tulip-suricata
    build:
      context: suricata
      dockerfile: Dockerfile.suricata
    restart: unless-stopped
    volumes:
      - ${SURICATA_DIR_HOST}/log:/var/log/suricata
      - ${SURICATA_DIR_HOST}/etc:/etc/suricata
      - ${SURICATA_DIR_HOST}/lib:/var/lib/suricata
      - ${SURICATA_DIR_HOST}/socket:/var/run/suricata
    environment:
      SURICATA_OPTIONS: "-l /var/log/suricata -v -r /dev/stdin"
      PCAP_OVER_IP: ${PCAP_OVER_IP}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      enricher:
        condition: service_healthy

volumes:
  timescale-data:
  grafana-data:

networks:
  internal:
    internal: false
